version: "3.8"

services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: hotel_booking
      POSTGRES_USER: touhaf
      POSTGRES_PASSWORD: ${HOTEL_DB_PASSWORD:?HOTEL_DB_PASSWORD manquant}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hotel-booking:local
    init: true
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hotel_booking
      SPRING_DATASOURCE_USERNAME: touhaf
      SPRING_DATASOURCE_PASSWORD: ${HOTEL_DB_PASSWORD:?HOTEL_DB_PASSWORD manquant}
      HOTEL_JWT_SECRET: ${HOTEL_JWT_SECRET:?HOTEL_JWT_SECRET manquant}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: